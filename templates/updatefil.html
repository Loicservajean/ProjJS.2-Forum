{{define "updatefil"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Fil.Name}}</title>
    <link rel="stylesheet" href="/static/css/fils.css">
</head>
<body>
<header class="header">
    <div class="align-header">
        <div class="brand">
            <img class="logo" src="/static/assets/logo.png" alt="Rompelago Logo">
            <div>
                <img class="text" src="/static/assets/ROMPELAGO.png" alt="Rompelago Logo">
            </div>
        </div>
        <div class="auth-links">
            <a class="btn-login" href="/connection">Connection</a>
            <a class="btn-register" href="/inscription">Inscription</a>
        </div>
    </div>
</header>
<main>
    <form action="/fil/update{{$.Fil.Id}}" method="post">
        <label for="titre">Titre : {{.Fil.Name}}</label>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6" placeholder="{{.Fil.Description}}" required>{{.Fil.Description}}</textarea>

        <label for="categorie_id">Catégorie</label>
        <select id="categorie_id" name="categorie_id">
          {{range .Categories}}
            <option value="{{.Id}}">{{.Name}}</option>
          {{end}}
        </select>

        <label for="status_id">Statut</label>
        <select id="status_id" name="status_id">
          {{range .Status}}
            <option value="{{.Id}}">{{.Name}}</option>
          {{end}}
        </select>

        <div class="form-actions">
          <button type="submit" class="btn-register">Publier la nouvelle version</button>
          <a href="/forum" class="cancel-link">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
{{end}}
