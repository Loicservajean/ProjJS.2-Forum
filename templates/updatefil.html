{{define "updatefil"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Fil.Name}}</title>
    <link rel="stylesheet" href="/static/css/update.css">
</head>
<body>
<header class="header">
    <div class="align-header">
        <a class="brand" href="/forum">
            <img class="logo" src="/static/assets/logo.png" alt="Rompelago Logo">
            <div>
                <img class="text" src="/static/assets/ROMPELAGO.png" alt="Rompelago Logo">
            </div>
        </a>
        <div class="auth-links">
            <a class="btn-login" href="/connection">Connection</a>
            <a class="btn-register" href="/inscription">Inscription</a>
        </div>
    </div>
</header>
<main>
    <section class="box">
        <h1>Modifier le fil</h1>
        <form class="update-form" action="/fil/{{$.Fil.Id}}/update" method="post">
            <label for="titre">Titre</label>
            <input id="titre" type="text" value="{{.Fil.Name}}" disabled>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="6" required>{{.Fil.Description}}</textarea>

            <label for="categorie_id">Catégorie</label>
            <select id="categorie_id" name="categorie_id">
              {{range .Categories}}
                <option value="{{.Id}}">{{.Name}}</option>
              {{end}}
            </select>

            <label for="status_id">Statut</label>
            <select id="status_id" name="status_id">
              {{range .Statuts}}
                <option value="{{.Id}}">{{.Nom}}</option>
              {{end}}
            </select>

            <div class="form-actions">
              <button type="submit" class="btn-register">Publier la nouvelle version</button>
              <a href="/forum" class="cancel-link">Annuler</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
{{end}}
