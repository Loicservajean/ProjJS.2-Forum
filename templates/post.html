{{define "post"}}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts - Rompelago</title>
  <link rel="stylesheet" href="/static/css/post.css">
</head>
<body>
  <header class="header">
    <div class="align-header">
      <div class="brand">
        <img class="logo" src="/static/assets/logo.png" alt="Rompelago Logo">
        <div>
          <img class="text" src="/static/assets/ROMPELAGO.png" alt="Rompelago Logo">
        </div>
      </div>
      <div class="auth-links">
        <a class="btn-login" href="/connection">connection</a>
        <a class="btn-register" href="/inscription">Inscription</a>
      </div>
    </div>
  </header>
  <main>
    <div class="box">
      <h1>Posts</h1>
      <form action="/nouveaupost" method="post" class="post-form">
        <label for="name">Titre</label>
        <input id="name" name="name" type="text" placeholder="Titre du post" required>

        <label for="contenu">Message</label>
        <textarea id="contenu" name="contenu" rows="6" placeholder="Écris ton message..." required></textarea>

        <div class="form-actions">
          <button type="submit" class="btn-register">Publier</button>
          <a href="/forum" class="cancel-link">Annuler</a>
        </div>
      </form>

      <div class="post-list">
        {{if .}}
          {{range .}}
          <div class="post-card">
            <div class="vote-bar">
              <a href="/post/{{.Id}}/like" class="vote-btn vote-up">
                <span class="vote-icon">👍</span>
                <span class="vote-count">{{.NbLike}}</span>
              </a>
              <a href="/post/{{.Id}}/dislike" class="vote-btn vote-down">
                <span class="vote-icon">👎</span>
                <span class="vote-count">{{.NbDislike}}</span>
              </a>
            </div>
            <div class="post-content">
              <div class="post-meta">
                <span class="post-author">{{.Creator.Name}}</span>
                <span class="post-date">{{.DateCreation}}</span>
              </div>
              <h2 class="post-title">{{.Name}}</h2>
              <p class="post-body">{{.Contenu}}</p>
            </div>
          </div>
          {{end}}
        {{else}}
          <p>Aucun post pour le moment.</p>
        {{end}}
      </div>
    </div>
  </main>
</body>
</html>
{{end}}
