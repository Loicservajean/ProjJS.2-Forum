{{define "connection"}}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>connection - Rompelago</title>
  <link rel="stylesheet" href="/static/css/inscription.css">
</head>
<body>
  <header class="header">
    <div class="align-header">
      <img class="logo" src="/static/assets/logo.png" alt="Rompelago Logo">
      <div>
        <img class="text" src="/static/assets/ROMPELAGO.png" alt="Rompelago Logo">
      </div>
    </div>
  </header>
  <main>
    <div class="box form-box">
      <h1>connection</h1>
      <p>Connectez-vous pour accéder à votre compte Rompelago.</p>
      {{if .Error}}
        <p class="form-error">{{.Error}}</p>
      {{end}}
      <form action="/connection" method="post">
        <label for="username">Nom d'utilisateur</label>
        <input id="username" name="username" type="text" placeholder="Votre pseudo" required>
        
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" placeholder="mail@exemple.com" required>

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" placeholder="********" required>

        <button type="submit">Se connecter</button>
      </form>
      <p class="form-footer">Pas encore membre ? <a href="/inscription">Inscrivez-vous</a></p>
    </div>
  </main>
</body>
</html>
{{end}}
